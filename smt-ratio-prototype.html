<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>SMT Ratio — Product Prototype</title>
  <link rel="stylesheet" href="./vanilla/design-system.css" />
  <style>
    :root[data-theme="dark"] {
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      color-scheme: light;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--color-semantic-background-canvas);
      color: var(--color-semantic-text-primary);
      font-family: var(--font-family-sans);
    }

    /* Search Command Dialog — spacious OpenAI Platform proportions (top-pinned, zero-jump) */
    [data-ds-search-dialog]:not([hidden]) {
      display: grid;
      align-items: start;
      justify-items: center;
      padding: clamp(56px, 14vh, 136px) var(--space-4) var(--space-6);
      overscroll-behavior: contain;
    }

    [data-ds-search-dialog] .ds-cmd-palette {
      width: 100%;
      max-width: 600px;
      border-radius: var(--radius-xl);
      background: var(--color-semantic-background-menu);
      border: 1px solid color-mix(in srgb, var(--color-semantic-text-primary) 10%, transparent);
      box-shadow: var(--shadow-menu);
      animation: ds-dialog-enter var(--motion-duration-basic) cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-ds-search-dialog] .ds-cmd-palette-header {
      min-height: 52px;
      padding: var(--space-3) var(--space-4);
      gap: var(--space-3);
    }

    [data-ds-search-dialog] .ds-cmd-palette-icon,
    [data-ds-search-dialog] .ds-cmd-palette-icon svg {
      width: 16px;
      height: 16px;
    }

    [data-ds-search-dialog] .ds-cmd-palette-input {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-normal);
      line-height: var(--font-line-height-normal);
    }

    [data-ds-search-dialog] .ds-cmd-palette-kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 22px;
      padding: 0 var(--space-2);
      border: 1px solid color-mix(in srgb, var(--color-semantic-text-primary) 12%, transparent);
      border-radius: var(--radius-sm);
      background: color-mix(in srgb, var(--color-semantic-text-primary) 5%, transparent);
      font-family: var(--font-family-mono);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-normal);
      line-height: 1;
      color: var(--color-semantic-text-tertiary);
      cursor: pointer;
      transition: color var(--motion-duration-basic) cubic-bezier(0.16, 1, 0.3, 1),
                  background-color var(--motion-duration-basic) cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-ds-search-dialog] .ds-cmd-palette-kbd:hover {
      color: var(--color-semantic-text-primary);
      background: var(--color-semantic-background-menu-hover);
    }

    [data-ds-search-dialog] .ds-cmd-palette-list {
      max-height: min(360px, 52vh);
      padding: var(--space-2);
      gap: 2px;
      overscroll-behavior: contain;
      border-top: 1px solid color-mix(in srgb, var(--color-semantic-text-primary) 8%, transparent);
    }

    [data-ds-search-dialog] .ds-cmd-palette-group-title {
      padding: var(--space-2) var(--space-2) var(--space-1);
      font-family: var(--font-family-sans);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-normal);
      line-height: var(--font-line-height-normal);
      color: var(--color-semantic-text-tertiary);
    }

    [data-ds-search-dialog] .ds-cmd-palette-item {
      min-height: 40px;
      padding: var(--space-2);
      gap: var(--space-3);
      border-radius: var(--radius-md);
    }

    [data-ds-search-dialog] .ds-cmd-palette-item:hover,
    [data-ds-search-dialog] .ds-cmd-palette-item[aria-selected="true"] {
      background: var(--color-semantic-background-menu-hover);
    }

    [data-ds-search-dialog] .ds-cmd-palette-item-icon,
    [data-ds-search-dialog] .ds-cmd-palette-item-icon svg {
      width: 16px;
      height: 16px;
    }

    [data-ds-search-dialog] .ds-cmd-palette-label {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-normal);
      line-height: var(--font-line-height-normal);
    }

    [data-ds-search-dialog] .ds-cmd-palette-empty {
      padding: var(--space-8) var(--space-4);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-normal);
      color: var(--color-semantic-text-secondary);
    }

    @media (prefers-reduced-motion: reduce) {
      [data-ds-search-dialog] .ds-cmd-palette,
      [data-ds-search-dialog] .ds-cmd-palette-kbd {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>
