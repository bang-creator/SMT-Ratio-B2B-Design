name: Deploy Preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble preview site
        run: |
          mkdir -p _site/vanilla _site/assets
          cp smt-ratio-prototype.html _site/index.html
          cp smt-ratio-prototype.html _site/smt-ratio-prototype.html
          cp smt-ratio-workflows.css smt-ratio-workflows.js _site/
          cp vanilla/design-system.css vanilla/design-system.js _site/vanilla/
          cp -R assets/. _site/assets/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
